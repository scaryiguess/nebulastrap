<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>icon source</title>
  <style>

    html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }

    .plate {
      position: absolute;
      inset: 48px;
      border-radius: 190px;
      background:
        radial-gradient(120% 90% at 30% 0%, #1b2340, #0d1020 55%, #07080f);
      box-shadow:
        inset 0 8px 0 rgba(255, 255, 255, 0.09),
        inset 0 -10px 30px rgba(0, 0, 0, 0.8),
        0 40px 90px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .plate::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(60% 45% at 22% 8%, rgba(56, 219, 255, 0.30), transparent 70%),
        radial-gradient(58% 50% at 86% 96%, rgba(124, 92, 255, 0.34), transparent 70%);
    }

    .art {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    #brand-art svg { height: 660px; width: auto; zoom: 1; animation: none !important; }
    #brand-art svg * { animation: none !important; }
    #brand-art .particle { opacity: 1; }
  </style>
</head>
<body>
  <div class="plate"></div>
  <div class="art"><div id="brand-art"></div></div>
  <script src="../src/renderer/js/brand-art.js"></script>
</body>
</html>
